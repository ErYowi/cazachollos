name: Cazachollos

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos, día y noche
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: cazachollos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar chollos
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node run.mjs
      - name: Guardar anuncios ya vistos
        run: |
          git config user.name "cazachollos-bot"
          git config user.email "cazachollos-bot@users.noreply.github.com"
          git add seen.json deals.json
          git diff --cached --quiet || (git commit -m "vistos" && git pull --rebase && git push)
